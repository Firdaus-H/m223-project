# Simple local embedded database: no Docker or PostgreSQL setup required.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./gamelibrary
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Database schema updates for local development only.
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.sql-load-script=no-file
%dev.gamelibrary.example-data.enabled=true

# Test database: separate and disposable.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:gamelibrary-test
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.gamelibrary.example-data.enabled=false

# Production schema changes should be managed explicitly.
%prod.quarkus.hibernate-orm.schema-management.strategy=none
